name: Bug report / 问题反馈
description: Report a reproducible switching or startup problem / 提交可复现问题
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API keys、auth.json、完整 config.toml、进程参数或私人路径。Please redact credentials and private paths.
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, architecture, VS Code version, Codex extension version, and switcher version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
      description: Include a redacted error message, if available.
    validations:
      required: true
